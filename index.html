<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>uno.pro.bd Mail</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="login-screen" class="screen">
    <div class="card">
      <h1>uno.pro.bd</h1>
      <p>Get a free @uno.pro.bd email address.</p>
      <button id="google-signin-btn">Sign in with Google</button>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header>
      <div>
        <strong id="user-name"></strong>
        <div id="alias-display" class="alias"></div>
      </div>
      <button id="signout-btn">Sign out</button>
    </header>

    <main>
      <section class="panel">
        <h2>Compose</h2>
        <input id="compose-to" type="email" placeholder="To" />
        <input id="compose-subject" type="text" placeholder="Subject" />
        <textarea id="compose-body" rows="5" placeholder="Message"></textarea>
        <button id="send-btn">Send</button>
        <div id="send-status"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Inbox</h2>
          <button id="refresh-btn">Refresh</button>
        </div>
        <div id="inbox-list"></div>
      </section>
    </main>
  </div>

  <!-- Firebase (client SDK, no secrets exposed) -->
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
